name: af_$(SourceBranchName)_$(Build.SourceVersion)

pool:
  vmImage: 'ubuntu-latest'

variables:
  AWS_REGION: 'us-east-1'                  # replace with the actual region
  AWS_INSTANCE_ID: 'i-xxxxxxxxxxxxxxxxx,i-yyyyyyyyyyyyyyyyy'   # comma-separated list of instance IDs

steps:
- task: AWSShellScript@1
  displayName: 'Shutting down instances in dev'
  inputs:
    awsCredentials: 'aws-dev-connection'
    regionName: '$(AWS_REGION)'
    scriptType: 'inline'
    inlineScript: |
      # Convert the comma-separated list into space-separated IDs
      INSTANCE_IDS=$(echo "$AWS_INSTANCE_ID" | tr ',' ' ')
      echo "Stopping instances: $INSTANCE_IDS"
      aws ec2 stop-instances --instance-ids $INSTANCE_IDS
